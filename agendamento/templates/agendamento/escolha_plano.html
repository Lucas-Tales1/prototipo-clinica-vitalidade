{% load static %}

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seleção de Plano de Saúde - Agenda Maker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        // Cores extraídas da logo
                        'azul-clinica': '#004d5b', // Azul Petróleo Profundo
                        'bege-clinica': '#a8835d', // Bege/Dourado do ponto
                        'cinza-fundo': '#f3f4f6', // Cinza claro para o fundo da página
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-cinza-fundo font-sans antialiased text-gray-900">

    <div class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
        <div class="max-w-md w-full space-y-8 bg-white p-10 rounded-xl shadow-lg border border-gray-100">
            
            <div class="text-center">
                <div class="mx-auto h-24 w-24 flex items-center justify-center mb-4">
                    <img src="{% static 'img/logo.png' %}" alt="Logo Clínica Vitalidade" class="h-10 w-auto mr-3 w-[200px]">
                </div>
                <h2 class="mt-6 text-3xl font-extrabold text-azul-clinica">
                    Agendamento de Consulta
                </h2>
                <p class="mt-2 text-sm text-gray-600">
                    Selecione seu plano de saúde para continuar.
                </p>
            </div>

            <form class="mt-8 space-y-6" action="{% url 'proxima_etapa_agendamento' %}" method="POST">
                {% csrf_token %}
                
                <div class="rounded-md shadow-sm -space-y-px">
                    <div class="mb-6">
                        <label for="id_plano" class="block text-sm font-medium text-gray-700 mb-2">Plano de Saúde</label>
                        <select id="id_plano" name="plano" required 
                            class="appearance-none rounded-lg relative block w-full px-3 py-3 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-azul-clinica focus:border-azul-clinica focus:z-10 sm:text-sm">
                            <option value="" disabled selected>Selecione seu plano</option>
                            <option value="unimed">Unimed</option>
                            <option value="bradesco">Bradesco Saúde</option>
                            <option value="sulamerica">SulAmérica</option>
                            <option value="amil">Amil</option>
                            <option value="particular">Particular</option>
                        </select>
                    </div>
                </div>

                <div>
                    <button type="submit" class="group relative w-full flex justify-center py-3 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-azul-clinica hover:bg-bege-clinica focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-azul-clinica transition duration-150 ease-in-out shadow-md">
                        <span class="absolute left-0 inset-y-0 flex items-center pl-3">
                            <svg class="h-5 w-5 text-white group-hover:text-white transition ease-in-out duration-150" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                                <path fill-rule="evenodd" d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z" clip-rule="evenodd" />
                            </svg>
                        </span>
                        Continuar
                    </button>
                </div>
            </form>

            <div class="text-center mt-4">
                <p class="text-sm text-gray-600">
                    Não encontrou seu plano? 
                    <a href="#" class="font-medium text-azul-clinica hover:text-bege-clinica transition duration-150 ease-in-out">
                        Entre em contato
                    </a>
                </p>
            </div>
        </div>
    </div>
</body>
</html>
